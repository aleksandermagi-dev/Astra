[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linnutee-astra"
version = "0.1.0"
description = "Astra v1 CLI for LinnuteeInnovations PR and marketing workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "elevenlabs>=1.7.0",
  "moviepy>=2.1.0",
  "openai>=2.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
astra = "astra.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
